# This file configures Twister to test your VR Tracker across your target hardware.
sample:
  description: VR Tracker Application firmware test
  name: vr-tracker-app

common:
  build_only: true
  # Tell the automated runner to test this code against the nRF52840 DK
  platform_allow:
    - nrf52840dk/nrf52840

tests:
  app.default: {}